[build]
  base = "web"
  command = "npm ci && npm run build && npm run check:dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://clerk.tanoytasi.shimizu-technology.com https://challenges.cloudflare.com https://*.protect.clerk.com; connect-src 'self' https://tano-y-tasi-api.onrender.com https://clerk.tanoytasi.shimizu-technology.com https://*.protect.clerk.com:*; img-src 'self' data: https://img.clerk.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com; form-action 'self' https://checkout.stripe.com; navigate-to 'self' https://checkout.stripe.com https://*.stripe.com; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
