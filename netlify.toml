[build]
  base = "web"
  command = "npm ci && npm run build && npm run check:dist"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

# Edge runtime (Functions scope) optionally reads STOREFRONT_API_URL and
# STOREFRONT_SITE_URL. Defaults are the production API and canonical storefront.
# Route matching and manual CDN caching are declared in the edge entry point.

[build.environment]
  NODE_VERSION = "22"

# The puzzle home preview: the `puzzle` branch is a branch deploy of this site, built with the map
# puzzle as its home page, at https://puzzle--tano-y-tasi.netlify.app. Production is unaffected.
[context.puzzle.environment]
  VITE_HOME_EXPERIENCE = "puzzle"

# The preview's own address, https://puzzle.shimizu-technology.com, is a domain alias of this site
# that serves the branch deploy. This domain is on Cloudflare, and outside Netlify DNS a branch
# deploy is only named under the primary domain. The storefront edge function passes this host through.
[[redirects]]
  from = "https://puzzle.shimizu-technology.com/*"
  to = "https://puzzle--tano-y-tasi.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://clerk.tanoytasi.shimizu-technology.com https://challenges.cloudflare.com https://*.protect.clerk.com https://us-assets.i.posthog.com; connect-src 'self' https://tano-y-tasi-api.onrender.com https://clerk.tanoytasi.shimizu-technology.com https://*.protect.clerk.com:* https://tano-y-tasi-media.s3.ap-southeast-1.amazonaws.com https://us.i.posthog.com https://us-assets.i.posthog.com; img-src 'self' data: https://img.clerk.com https://tano-y-tasi-media.s3.ap-southeast-1.amazonaws.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com; form-action 'self' https://checkout.stripe.com; navigate-to 'self' https://checkout.stripe.com https://*.stripe.com; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
